[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "laya-jev-bench"
version = "0.1.0"
description = "Reproducible head-to-head intent classification benchmarks for Laya and Jev"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
laya = ["laya-coreml==0.1.0"]
convert = ["laya-coreml[convert]==0.1.0"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
laya-jev-bench = "laya_jev_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_jev_bench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
